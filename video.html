<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Video-EQ</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Video-EQ</h1>
  <button id="btnExport" class="primary" disabled>Exportieren</button>
</header>

<main>
  <div class="row">
    <button id="btnPick">Video wählen</button>
  </div>
  <video id="video" playsinline controls hidden></video>
  <p class="hint" id="status">Bild und Videospur bleiben unverändert, nur der Ton wird bearbeitet.</p>

  <section class="panel">
    <div class="group">
      <h2>Equalizer</h2>
      <div id="bands"></div>
      <label class="slider">Pegel <input type="range" id="gain" min="-12" max="12" step="0.5"><output id="gainOut"></output></label>
      <label class="toggle"><input type="checkbox" id="eqOn" checked> EQ in der Vorschau hören</label>
      <div class="row" style="margin-top:10px">
        <button id="btnReset">Alles auf 0 dB</button>
      </div>
    </div>
  </section>
</main>

<input type="file" id="file" accept="video/*" hidden>

<div id="sheet" class="overlay" hidden>
  <div class="sheet-inner">
    <p id="resultInfo"></p>
    <p class="hint">„Sichern / Teilen“ → „Video sichern“ legt es in Fotos ab.</p>
    <div class="row">
      <button id="btnShare" class="primary">Sichern / Teilen</button>
      <button id="btnClose">Schließen</button>
    </div>
  </div>
</div>

<nav class="tabbar">
  <a href="./" data-tab="still">Collage</a>
  <a href="./?m=motion" data-tab="motion">Bewegt</a>
  <a href="bounce.html" data-tab="bounce">Abpraller</a>
  <a href="video.html" data-tab="video" class="on">Video-EQ</a>
</nav>

<script type="module" src="video.js"></script>
</body>
</html>
